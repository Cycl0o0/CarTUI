version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - gosec
    - revive
    - gocritic
    - unparam
    - unused
    - staticcheck
    - ineffassign
    - govet
    - bodyclose
    - errorlint
    - prealloc

  # `misspell` is disabled because the codebase mixes French and English
  # strings and the linter only knows en-US dictionaries — flagging
  # "Trafic" / "Couleur" as typos is noise.

  settings:
    revive:
      severity: warning
      rules:
        - name: exported
        - name: var-naming
        - name: package-comments
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: receiver-naming
        - name: indent-error-flow
        - name: superfluous-else
        - name: unused-parameter
          disabled: true
    gosec:
      excludes:
        - G104  # unhandled errors (covered by errcheck)
        - G304  # potential file inclusion via variable (false positives in TUI)
        - G115  # integer overflow (intentional Unix-time encoding in store/bookmarks.go)
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        - hugeParam
        - rangeValCopy
        # `evalOrder` warns whenever we call a function in a return
        # statement — but Bubble Tea idioms (`return model, cmd`)
        # routinely construct the cmd inline. Suppress globally rather
        # than forcing a temporary variable on every reducer.
        - evalOrder
        # The `style` group is otherwise disabled because
        # paramTypeCombine / unnamedResult / singleCaseSwitch all warn
        # on patterns we deliberately keep.

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - gocritic

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-same-issues: 50
  max-issues-per-linter: 100
