version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - gosec
    - revive
    - gocritic
    - unparam
    - unused
    - staticcheck
    - ineffassign
    - govet
    - misspell
    - bodyclose
    - errorlint
    - prealloc

  settings:
    revive:
      severity: warning
      rules:
        - name: exported
        - name: var-naming
        - name: package-comments
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: receiver-naming
        - name: indent-error-flow
        - name: superfluous-else
        - name: unused-parameter
          disabled: true
    gosec:
      excludes:
        - G104
        - G304
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        - hugeParam
        - rangeValCopy

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - gocritic

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-same-issues: 50
  max-issues-per-linter: 100
